name: Refresh DB caches
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose-report:
    if: github.repository == 'Yeahpromos/offer-intelligence' && github.ref == 'refs/heads/halfl1fe/repair-promotion-report'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyMySQL==1.1.1
      - name: Read promotion report without writing data
        env:
          OFFER_DB_HOST: ${{ vars.OFFER_DB_HOST }}
          OFFER_DB_NAME: ${{ vars.OFFER_DB_NAME }}
          OFFER_DB_USER: ${{ vars.OFFER_DB_USER }}
          OFFER_DB_PASSWORD: ${{ secrets.OFFER_DB_PASSWORD }}
          OFFER_DB_PORT: ${{ vars.OFFER_DB_PORT }}
        run: |
          python - <<'PY'
          import time
          import offer_performance as p
          original = p.db.fetch_all
          def traced(conn, sql, params=()):
              start = time.monotonic()
              try:
                  result = original(conn, sql, params)
                  print('QUERY', sql[:100], 'rows', len(result), 'seconds', round(time.monotonic()-start, 2), flush=True)
                  return result
              except Exception as error:
                  print('FAILED SQL', sql, type(error).__name__, str(error), flush=True)
                  raise
          with p.db.db_connection() as conn:
              for sql in ["SHOW VARIABLES WHERE Variable_name IN ('version','tmpdir','datadir','tmp_table_size','max_heap_table_size')", "SHOW GLOBAL STATUS LIKE 'Created_tmp%'", "SHOW FULL PROCESSLIST"]:
                  try:
                      rows = original(conn, sql)
                      if 'PROCESSLIST' in sql:
                          rows = [{k: r.get(k) for k in ('Id','Command','Time','State')} for r in rows]
                      print('SYSTEM', sql, rows, flush=True)
                  except Exception as e:
                      print('ERROR', type(e).__name__, str(e), flush=True)
              for table in ('cnpscy_amazon_order','cnpscy_amazon_click'):
                  try:
                      with conn.cursor() as cursor:
                          cursor.execute('SELECT * FROM ' + p.db.q(table) + ' LIMIT 0')
                          print('DIRECT METADATA', table, [c[0] for c in cursor.description], flush=True)
                  except Exception as e:
                      print('DIRECT ERROR', table, type(e).__name__, str(e), flush=True)
          PY
