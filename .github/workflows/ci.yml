name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-dashboard-tests:
    name: Static dashboard tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check JavaScript syntax
        run: |
          node --check public/auth.js
          node --check public/app.js
          node --check public/chatbot_i18n.js
          node --check public/tier2_recommendation_rules.js
          node --check public/chatbot_welcome.js
          node --check public/onboarding_tour.js

      - name: Run regression tests
        run: |
          python scripts/test_auth_helpers.py
          python scripts/test_vercel_function_budget.py
          python scripts/test_vercel_db_wsgi.py
          python scripts/test_vercel_auth_routes.py
          python scripts/test_vercel_chat_routes.py
          python scripts/test_vercel_payment_packaging.py
          python scripts/test_llm_stream_timeout.py
          python scripts/test_tier_report_date_range.py
          python scripts/test_merchant_aov_estimates.py
          python scripts/test_publishers_portfolio.py
          python scripts/test_brand_media_trend.py
          node scripts/test_brand_media_trend_frontend.mjs
          node scripts/test_publisher_manager_tier_frontend.mjs
          python scripts/test_monthly_new_merchants.py
          node scripts/test_monthly_new_merchants_frontend.mjs
          python scripts/test_tier1_agency_sync.py
          node scripts/test_tier_report_frontend.mjs
          python scripts/test_manual_tier_automation.py
          python scripts/test_tier_visual_status_rules.py
          python scripts/test_offer_network_lookup.py
          python scripts/test_workflow_cache_split.py
          node scripts/test_chatbot_intent_flow.mjs
          node scripts/test_commission_all_aff.mjs
          node scripts/test_merchant_monthly.mjs
          node scripts/test_onboarding_tour.mjs
          node scripts/test_chatbot_welcome.mjs
          node scripts/test_tier2_recommendation_rules.mjs
          node scripts/test_sheet_categories.mjs
          node scripts/test_category_drilldown.mjs
          node scripts/test_zh_chatbot.mjs
          python scripts/test_llm_agent.py
          python scripts/test_agent_http.py
          python scripts/test_agent_config.py
          node scripts/test_chat_agent.mjs
          python scripts/test_payment_placeholders.py
