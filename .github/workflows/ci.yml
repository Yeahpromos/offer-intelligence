name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - FRONTEND-VUE-MIGRATION
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modern-application-tests:
    name: Modern application tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and validate modern frontend
        run: |
          npm ci
          npm run test:copilotkit
          npm --prefix frontend ci
          npm --prefix frontend run typecheck
          npm --prefix frontend run test -- --run
          npm --prefix frontend run build

      - name: Check JavaScript syntax
        run: |
          node --check public/auth.js

      - name: Run regression tests
        run: |
          python scripts/test_auth_helpers.py
          python scripts/test_vercel_function_budget.py
          python scripts/test_vercel_db_wsgi.py
          python scripts/test_vercel_auth_routes.py
          python scripts/test_vercel_chat_routes.py
          python scripts/test_vercel_payment_packaging.py
          python scripts/test_llm_stream_timeout.py
          python scripts/test_tier_report_date_range.py
          python scripts/test_merchant_aov_estimates.py
          python scripts/test_publishers_portfolio.py
          python scripts/test_offer_performance.py
          python scripts/test_brand_media_trend.py
          python scripts/test_monthly_new_merchants.py
          node scripts/test_shared_xlsx_frontend.mjs
          python scripts/test_tier1_agency_sync.py
          python scripts/test_manual_tier_automation.py
          python scripts/test_tier_visual_status_rules.py
          python scripts/test_offer_network_lookup.py
          python scripts/test_workflow_cache_split.py
          node scripts/test_frontend_migration_inventory.mjs
          node scripts/test_frontend_build_contract.mjs
          node scripts/test_m4_shell_frontend.mjs
          node scripts/test_modern_page_cutover.mjs
          python scripts/test_google_ads_workbench.py
          node scripts/test_sheet_categories.mjs
          python scripts/test_llm_agent.py
          python scripts/test_agent_http.py
          python scripts/test_chat_stream_agent_config.py
          python scripts/test_agent_trace.py
          python scripts/test_agent_trace_http.py
          python scripts/test_llm_usage.py
          python scripts/test_agent_config.py
          python scripts/test_agent_tool_registry.py
          python scripts/test_agent_contract.py
          python scripts/test_agent_planning_contract.py
          python scripts/test_agent_synthesis_contract.py
          python scripts/test_agent_agui.py
          node scripts/test_m6_chatbot_agent_behavior_parity.mjs
          node scripts/test_m6_modern_mount.mjs
          node scripts/test_m7_modern_entry.mjs
          node scripts/test_tier_reporting_visual_contract.mjs
          python scripts/test_payment_placeholders.py
